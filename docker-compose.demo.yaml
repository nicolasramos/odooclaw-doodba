# OdooClaw demo stack for Coolify - odooclaw.jjgestiones.es
#
# Self-contained compose (no `extends`, no external file references, no fixed
# host ports) so Coolify can deploy it as a Docker Compose resource directly.
#
# Deliberately NOT based on prod.yaml / prod.coolify.yaml:
#   - prod.yaml uses `extends: common.yaml` + `env_file: .docker/*.env`, and
#     Coolify only copies the named compose file to the runtime directory, so
#     those references would not resolve.
#   - its labels hardcode `Host(`jjgestiones.es`)`, which would hijack traffic
#     from the client's real Odoo.
#
# Domain routing is left to Coolify: it appends the Traefik/Caddy labels from the
# resource's "Docker Compose domains" field (service `odoo` -> the public URL).

services:
  odoo:
    build:
      context: ./odoo
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    environment:
      # The official odoo:18 entrypoint derives the DB host from $HOST
      # (`${HOST:=${PGHOST:=db}}`) and passes it as --db_host, so leaving HOST
      # unset lets Coolify inject HOST=0.0.0.0 and Odoo then dials 0.0.0.0:5432.
      # Pinning it to the service name keeps the connection pointed at `db`.
      HOST: db
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${PGPASSWORD:-odoopassword}
      PGDATABASE: ${ODOO_DB:-demo}
      DB_FILTER: ^${ODOO_DB:-demo}$
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      INITIAL_LANG: es_ES
      LIST_DB: "false"
      ODOO_BUS_PUBLIC_SAMESITE_WS: 1
      PROXY_MODE: "true"
      # Coolify's magic domain variable: declaring it makes Coolify create the
      # SERVICE_FQDN_ODOO / SERVICE_URL_ODOO pair from the resource's
      # "Docker Compose domains" value, which the labels below then consume.
      SERVICE_URL_ODOO_8069: ""
      # Shared secret for the module's protected endpoints. Must match the value
      # the OdooClaw gateway sends in X-OdooClaw-Token.
      ODOOCLAW_REPLY_TOKEN: ${ODOOCLAW_REPLY_TOKEN}
    volumes:
      - odoo_filestore:/var/lib/odoo
      # Read-only view of the reset schedule, so the web client can show the
      # countdown to the next reset. The reset sidecar owns the file.
      - demo_shared:/shared:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8069"
    # Coolify injects SERVICE_FQDN_ODOO from the resource's "Docker Compose
    # domains" entry. A compose service only gets a Traefik router if it declares
    # its own labels, so the public hostname is wired explicitly here.
    labels:
      - coolify.managed=true
      - traefik.enable=true
      - traefik.http.routers.odooclaw-demo.rule=Host(`${SERVICE_FQDN_ODOO}`)
      - traefik.http.routers.odooclaw-demo.entryPoints=https
      - traefik.http.routers.odooclaw-demo.tls=true
      - traefik.http.routers.odooclaw-demo.tls.certresolver=letsencrypt
      - traefik.http.services.odooclaw-demo.loadbalancer.server.port=8069
    # Demo data stays ON (no --without-demo) so the assistant has real customers,
    # products, quotations and invoices to reason about.
    # `odoo` only -- no `--init`: the demo database is initialised once by
    # odoo/demo-entrypoint.sh. Passing `--init=...` here would re-import every demo
    # dataset on each restart and redeploy, aborting the registry with errors such
    # as "Cannot delete a purchase order line which is in state 'Purchase Order'".
    # The command must stay explicit: with `command:` absent, Coolify/compose
    # rewrites the service with an empty cmd and the official entrypoint exits 1.
    command:
      - odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_DB:-demo}
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${PGPASSWORD:-odoopassword}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - odoo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d ${ODOO_DB:-demo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - odoo_redis:/data

  # Automatic demo reset. The demo is public, so visitors change the admin
  # password and edit data; this restores the pristine dataset on a schedule so
  # nobody has to do it by hand. See odoo/demo-reset.sh for the full rationale.
  #
  # Runs the same image as `odoo` (one build) but with the reset script as its
  # entrypoint. Kept out of the `odoo` container on purpose: a reset drops and
  # recreates the database underneath the running web process, and that must not
  # be able to take the web process down.
  demo-reset:
    build:
      context: ./odoo
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/demo-reset.sh"]
    environment:
      ODOO_DB: ${ODOO_DB:-demo}
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${PGPASSWORD:-odoopassword}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-mail_bot_odooclaw,crm,sale_management,account,purchase,stock,contacts}
      # Hours between resets. 0 disables it.
      RESET_INTERVAL_HOURS: ${RESET_INTERVAL_HOURS:-24}
      # Reset immediately on boot as well as on the interval.
      RESET_ON_START: ${RESET_ON_START:-false}
      # Grace period after boot before the first scheduled reset, so a redeploy
      # doesn't wipe the database under someone mid-demo.
      RESET_GRACE_SECONDS: ${RESET_GRACE_SECONDS:-300}
      DEMO_SCHEDULE_FILE: /shared/demo_schedule.json
      ODOO_HEALTH_URL: http://odoo:8069/web/health
    volumes:
      # Publish the reset schedule so the web client can show a countdown.
      - demo_shared:/shared
    depends_on:
      db:
        condition: service_healthy
      odoo:
        condition: service_started

  odooclaw:
    build:
      context: ./odooclaw
      dockerfile: docker/Dockerfile.demo
    restart: unless-stopped
    environment:
      # LLM: any OpenAI-compatible endpoint. Rendered into config.json at start.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      ODOOCLAW_MODEL: ${ODOOCLAW_MODEL}
      # Must match Odoo's odooclaw.reply_token system parameter.
      ODOOCLAW_REPLY_TOKEN: ${ODOOCLAW_REPLY_TOKEN}
      # Odoo connection used by the odoo-mcp tools.
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-demo}
      ODOO_USERNAME: ${ODOO_USERNAME:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: localhost,127.0.0.1,odoo,redis,db
    volumes:
      - odooclaw_data:/home/odooclaw/.odooclaw
    depends_on:
      - odoo
      - redis
    expose:
      - "18790"

volumes:
  odoo_filestore:
  odoo_db:
  odoo_redis:
  odooclaw_data:
  demo_shared:
